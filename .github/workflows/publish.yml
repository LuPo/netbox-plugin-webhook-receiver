name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The tag, pyproject.toml and __init__.py must agree on the version
      - name: Check version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version=$(grep -m1 '^version = ' pyproject.toml | cut -d '"' -f2)
          plugin_version=$(grep -m1 '^__version__ = ' netbox_webhook_receiver/__init__.py | cut -d '"' -f2)
          echo "tag: $tag_version, pyproject: $project_version, plugin: $plugin_version"
          if [ "$tag_version" != "$project_version" ] || [ "$tag_version" != "$plugin_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the package version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/netbox-plugin-webhook-receiver/
    permissions:
      # Required for PyPI trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
